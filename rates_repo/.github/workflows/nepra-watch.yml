name: Watch NEPRA for new rates

on:
  schedule:
    - cron: "17 5 * * *" # every day, 10:17 Pakistan time
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for new NEPRA notifications
        id: watch
        run: python scripts/nepra_watch.py

      - name: Open an issue
        if: steps.watch.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "New NEPRA tariff notification — update rates ($(date +%d-%b-%Y))" \
            --body-file issue_body.md

      - name: Save what we've seen
        run: |
          git config user.name "rates-watch"
          git config user.email "rates-watch@users.noreply.github.com"
          git add nepra_seen.json
          git diff --cached --quiet || git commit -m "Record NEPRA documents seen $(date +%F)"
          git push
